name: Build and Release SleepOnLAN

on:
  push:
    branches: [master, ci-testing]
  pull_request:
    branches: [master]

env:
  PACKAGE: sleep-on-lan
  GOPATH: ${{ github.workspace }}
  GO111MODULE: on

jobs:
  versioning:
    name: 🔖 Determine Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔖 Bump version and create tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false

  build:
    name: 🏗️ Build on ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: versioning

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, 386, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: arm

    env:
      VERSION: ${{ needs.versioning.outputs.version }}
      PACKAGE: sleep-on-lan
      GO111MODULE: on

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧠 Set release label
        run: |
          echo "VERSION_LABEL=${{ github.ref_name == 'master' && 'RELEASE' || 'SNAPSHOT' }}" >> $GITHUB_ENV

      - name: 🧰 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🧽 Go mod tidy
        run: |
          cd src
          go mod tidy

      - name: 🔧 Build binary
        run: |
          cd src
          BUILD_TIME=$(date "+%FT%T%z")
          COMMIT=$(git rev-parse HEAD)
          BIN_DIR="../bin/${{ matrix.goos }}_${{ matrix.goarch }}"
          OUTPUT="$BIN_DIR/sol"
          [[ "${{ matrix.goos }}" == "windows" ]] && OUTPUT="${OUTPUT}.exe"

          mkdir -p "$BIN_DIR"
          LDFLAGS="-s -w \
            -X 'main.BuildCommit=${COMMIT}' \
            -X 'main.BuildVersion=${VERSION}' \
            -X 'main.BuildVersionLabel=${VERSION_LABEL}' \
            -X 'main.BuildCompilationTimestamp=${BUILD_TIME}'"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -tags netgo -ldflags "${LDFLAGS}" -o "$OUTPUT" .

      - name: ✅ Verify binary exists
        run: |
          OUTPUT="bin/${{ matrix.goos }}_${{ matrix.goarch }}/sol"
          [[ "${{ matrix.goos }}" == "windows" ]] && OUTPUT="${OUTPUT}.exe"
          [[ -f "$OUTPUT" ]] && echo "✅ Binary exists: $OUTPUT" || (echo "❌ Missing binary: $OUTPUT"; exit 1)

      - name: 📝 Copy configuration and scripts
        run: |
          TARGET=bin/${{ matrix.goos }}_${{ matrix.goarch }}
          CONFIG="resources/configuration/default/sol-basic-configuration.json"

          if [[ -f "$CONFIG" ]]; then
            cp "$CONFIG" "$TARGET/sol.json"
          else
            echo "❌ Missing configuration file: $CONFIG"
            exit 1
          fi

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp resources/script/*.bat "$TARGET/" || echo "⚠️ No batch scripts found."
          fi

      - name: 📚 Archive binaries
        run: |
          cd bin
          ZIP="SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          zip -r -9 "$ZIP" "./${{ matrix.goos }}_${{ matrix.goarch }}/"

      - name: ✅ Verify zip archive
        run: |
          ZIP="bin/SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          [[ -f "$ZIP" ]] && echo "✅ Found zip archive: $ZIP" || (echo "❌ Missing zip: $ZIP"; exit 1)

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, versioning]
    if: needs.versioning.outputs.version != ''

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 🔒 Generate checksums
        run: |
          cd dist
          find . -name '*.zip' -exec sha256sum {} \; > checksums.txt
          echo "✅ SHA256 checksums generated."

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: SleepOnLAN ${{ needs.versioning.outputs.version }}
          body_path: dist/checksums.txt
          prerelease: ${{ github.ref_name != 'master' }}
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
