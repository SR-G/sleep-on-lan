name: Build and Release SleepOnLAN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE: sleep-on-lan
  GOPATH: ${{ github.workspace }}
  GO111MODULE: on

jobs:
  build:
    name: 🏗️ Cross-platform Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, 386, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: arm

    outputs:
      version: ${{ steps.tagger.outputs.new_tag }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔖 Bump version and create tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧠 Set version environment
        run: echo "VERSION=${{ steps.tagger.outputs.new_tag }}" >> $GITHUB_ENV

      - name: 🧠 Set release label
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "VERSION_LABEL=RELEASE" >> $GITHUB_ENV
          else
            echo "VERSION_LABEL=SNAPSHOT" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: 🧰 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🧽 Go mod tidy
        run: |
          cd src
          go mod tidy

      - name: 🧼 Prepare directories
        run: mkdir -p bin/${{ matrix.goos }}_${{ matrix.goarch }}

      - name: 🔧 Build binary
        run: |
          cd src
          BUILD_TIME=$(date "+%FT%T%z")
          COMMIT=$(git rev-parse HEAD)
          LDFLAGS="-s -w \
            -X 'main.BuildCommit=${COMMIT}' \
            -X 'main.BuildVersion=${VERSION}' \
            -X 'main.BuildVersionLabel=${VERSION_LABEL}' \
            -X 'main.BuildCompilationTimestamp=${BUILD_TIME}'"
          GOARCH=${{ matrix.goarch }} GOOS=${{ matrix.goos }} go install -a -tags netgo -installsuffix netgo -ldflags "${LDFLAGS}" $PACKAGE

      - name: 📦 Copy binary
        run: |
          BIN_DIR=bin/${{ matrix.goos }}_${{ matrix.goarch }}
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp $GOPATH/bin/windows_${{ matrix.goarch }}/${PACKAGE}.exe $BIN_DIR/sol.exe
          else
            cp $GOPATH/bin/${PACKAGE} $BIN_DIR/sol

      - name: 📝 Copy configuration and scripts
        run: |
          TARGET=bin/${{ matrix.goos }}_${{ matrix.goarch }}
          cp resources/configuration/default/sol-basic-configuration.json $TARGET/sol.json
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp resources/script/*.bat $TARGET/
          fi

      - name: 📚 Archive binaries
        run: |
          cd bin
          zip -r -9 SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip ./${{ matrix.goos }}_${{ matrix.goarch }}/

      - name: 📤 Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLAN-${{ env.VERSION }}-${{ env.VERSION_LABEL }}-${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/SleepOnLAN-${{ env.VERSION }}-${{ env.VERSION_LABEL }}-${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: SleepOnLAN ${{ needs.build.outputs.version }}
          body: |
            🎉 New version release of SleepOnLAN!
            Version: `${{ needs.build.outputs.version }}`

            Includes:
            - Cross-platform binaries for Linux and Windows
            - Configuration files and batch scripts
          prerelease: ${{ env.VERSION_LABEL != 'RELEASE' }}
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
