name: Build and Release SleepOnLAN

on:
  push:
    branches: [master, ci-testing]
  pull_request:
    branches: [master]

env:
  PACKAGE: sleep-on-lan
  GOPATH: ${{ github.workspace }}
  GO111MODULE: on

jobs:
  versioning:
    name: 🔖 Determine Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tagger.outputs.new_tag }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔖 Bump version and create tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false

  build:
    name: 🏗️ Cross-platform Build
    runs-on: ubuntu-latest
    needs: versioning

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, 386, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: arm

    env:
      VERSION: ${{ needs.versioning.outputs.version }}
      GOPATH: ${{ github.workspace }}
      PACKAGE: sleep-on-lan
      GO111MODULE: on

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧠 Set release label
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "VERSION_LABEL=RELEASE" >> $GITHUB_ENV
          else
            echo "VERSION_LABEL=SNAPSHOT" >> $GITHUB_ENV
          fi
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: 🧰 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🧽 Go mod tidy
        run: |
          cd src
          go mod tidy

      - name: 🧼 Prepare directories
        run: mkdir -p bin/${{ matrix.goos }}_${{ matrix.goarch }}

      - name: 🔧 Build binary
        run: |
          cd src
          BUILD_TIME=$(date "+%FT%T%z")
          COMMIT=$(git rev-parse HEAD)
          LDFLAGS="-s -w \
            -X 'main.BuildCommit=${COMMIT}' \
            -X 'main.BuildVersion=${VERSION}' \
            -X 'main.BuildVersionLabel=${VERSION_LABEL}' \
            -X 'main.BuildCompilationTimestamp=${BUILD_TIME}'"
          OUTPUT="../bin/${{ matrix.goos }}_${{ matrix.goarch }}/sol"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            OUTPUT="${OUTPUT}.exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -tags netgo -ldflags "${LDFLAGS}" -o "$OUTPUT" $PACKAGE

      - name: 📦 Copy binary (validated)
        run: |
          BIN_DIR=bin/${{ matrix.goos }}_${{ matrix.goarch }}
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BIN_PATH="$GOPATH/bin/windows_${{ matrix.goarch }}/${PACKAGE}.exe"
            if [[ -f "$BIN_PATH" ]]; then
              cp "$BIN_PATH" "$BIN_DIR/sol.exe"
            else
              echo "❌ Binary not found: $BIN_PATH"
              exit 1
            fi
          else
            BIN_PATH="$GOPATH/bin/${PACKAGE}"
            if [[ -f "$BIN_PATH" ]]; then
              cp "$BIN_PATH" "$BIN_DIR/sol"
            else
              echo "❌ Binary not found: $BIN_PATH"
              exit 1
            fi
          fi

      - name: 📝 Copy configuration and scripts
        run: |
          TARGET=bin/${{ matrix.goos }}_${{ matrix.goarch }}
          cp resources/configuration/default/sol-basic-configuration.json $TARGET/sol.json
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp resources/script/*.bat $TARGET/
          fi

      - name: 📚 Archive binaries
        run: |
          cd bin
          ZIP_NAME="SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          zip -r -9 "$ZIP_NAME" "./${{ matrix.goos }}_${{ matrix.goarch }}/"

      - name: ✅ Verify zip archive
        run: |
          ZIP_NAME="SleepOnLAN-${VERSION}-${VERSION_LABEL}-${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          if [[ -f "bin/$ZIP_NAME" ]]; then
            echo "✅ Found zip archive: bin/$ZIP_NAME"
          else
            echo "❌ Missing zip archive: bin/$ZIP_NAME"
            exit 1
          fi

      - name: 📤 Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLAN-${{ env.VERSION }}-${{ env.VERSION_LABEL }}-${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/SleepOnLAN-${{ env.VERSION }}-${{ env.VERSION_LABEL }}-${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, versioning]
    if: needs.versioning.outputs.version != ''

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: SleepOnLAN ${{ needs.versioning.outputs.version }}
          body: |
            🎉 New version release of SleepOnLAN!
            Version: `${{ needs.versioning.outputs.version }}`

            Includes:
            - Cross-platform binaries for Linux and Windows
            - Configuration files and batch scripts
          prerelease: ${{ env.VERSION_LABEL != 'RELEASE' }}
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
